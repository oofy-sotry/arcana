# Arcana 서버·LLM 게이트웨이·요약 워커·Redis
# VM에서: cp .env.example .env (값 채우기) → docker compose pull && docker compose up -d
# 직접 빌드: docker compose up -d --build / 확인: ARCANA_GATEWAY_TOKEN=<토큰> deploy/smoke.sh
name: arcana

x-gateway-image: &gateway-image
  image: ghcr.io/oofy-sotry/arcana-gateway:${ARCANA_IMAGE_TAG:-latest}
  build: apps/gateway

services:
  server:
    image: ghcr.io/oofy-sotry/arcana-server:${ARCANA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET을 설정하세요}
    ports:
      - "${SERVER_BIND:-0.0.0.0}:4000:4000"
    volumes:
      # 기본은 named volume. 이 VM의 기존 DB를 쓰려면 .env에 SERVER_DATA_DIR=./apps/server/data
      - ${SERVER_DATA_DIR:-server-data}:/app/apps/server/data
    restart: unless-stopped

  gateway:
    <<: *gateway-image
    environment:
      ARCANA_GATEWAY_TOKEN: ${ARCANA_GATEWAY_TOKEN:?.env에 ARCANA_GATEWAY_TOKEN을 설정하세요}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      ARCANA_GATEWAY_CONFIG: /config/gateway.json
    volumes:
      - ./deploy/gateway.json:/config/gateway.json:ro
    # 호스트의 Ollama(deploy/gateway.json). Ollama가 127.0.0.1에만 열려 있으면 닿지 않는다 →
    # Ollama 서비스에 OLLAMA_HOST=0.0.0.0 필요. 데스크톱 잡담 모델은 기본 설정상 Ollama에 직접 붙으므로 없어도 동작
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 공급자 키를 들고 있으므로 기본은 이 VM 안에서만. 다른 PC의 클라이언트가 쓰려면 GATEWAY_BIND=0.0.0.0
      - "${GATEWAY_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *gateway-image
    command: ["python", "-m", "arcana_gateway.worker"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      ARCANA_GATEWAY_CONFIG: /config/gateway.json
    volumes:
      - ./deploy/gateway.json:/config/gateway.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 요약 job과 결과(TTL 1시간)만 담으므로 디스크에 저장하지 않는다. 포트는 열지 않음(compose 내부망만)
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  server-data:
