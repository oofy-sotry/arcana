<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
  <title>Arcana</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: #0a0a1a; color: #eee; height: 100vh; overflow: hidden; }

    .screen { display: none; position: fixed; inset: 0; z-index: 100; flex-direction: column; }

    #game-ui { display: none; flex-direction: column; height: 100vh; }

    nav { display: flex; flex-wrap: wrap; background: #16213e; border-bottom: 1px solid #0f3460; flex-shrink: 0; }
    nav button { flex: 1; padding: 10px 6px; background: none; border: none; color: #aaa; cursor: pointer; font-size: 12px; min-width: 40px; }
    nav button.active { color: #e94560; border-bottom: 2px solid #e94560; }
    #btn-hunting { background: #0f3460 !important; color: #e94560 !important; font-weight: bold; border-left: 1px solid #1a4a7a; }
    #btn-town    { background: #1a2e10 !important; color: #ffd54f !important; font-weight: bold; }

    #content { flex: 1; overflow-y: auto; padding: 16px; background: #1a1a2e; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>
  <div id="screen-start"  class="screen"></div>
  <div id="screen-create" class="screen"></div>
  <div id="screen-world"  class="screen"></div>

  <div id="game-ui">
    <nav>
      <button class="active" data-tab="pets">에레멘탈</button>
      <button data-tab="stats">스탯</button>
      <button data-tab="skills">스킬</button>
      <button data-tab="items">아이템</button>
      <button data-tab="breeding">교배</button>
      <button data-tab="gacha">가챠</button>
      <button data-tab="party">파티</button>
      <button data-tab="quest">퀘스트</button>
      <button data-tab="online">온라인</button>
      <button data-tab="equipment">장비</button>
      <button data-tab="faction">세력</button>
      <button data-tab="story">스토리</button>
      <button data-tab="collection">도감</button>
      <button id="btn-hunting">⚔ 사냥터</button>
      <button id="btn-town">🏘 마을</button>
    </nav>

    <div id="content">
      <div id="tab-pets"      class="tab-panel active"></div>
      <div id="tab-stats"     class="tab-panel"></div>
      <div id="tab-skills"    class="tab-panel"></div>
      <div id="tab-items"     class="tab-panel"></div>
      <div id="tab-breeding"  class="tab-panel"></div>
      <div id="tab-gacha"     class="tab-panel"></div>
      <div id="tab-party"     class="tab-panel"></div>
      <div id="tab-quest"     class="tab-panel"></div>
      <div id="tab-online"    class="tab-panel"></div>
      <div id="tab-equipment" class="tab-panel"></div>
      <div id="tab-faction"   class="tab-panel"></div>
      <div id="tab-story"     class="tab-panel"></div>
      <div id="tab-collection" class="tab-panel"></div>
    </div>
  </div>

  <script src="components/PetCard.js"></script>
  <script src="components/StatPanel.js"></script>
  <script src="components/SkillTree.js"></script>
  <script src="components/ItemPanel.js"></script>
  <script src="components/BreedingPanel.js"></script>
  <script src="components/GachaPanel.js"></script>
  <script src="components/PartyPanel.js"></script>
  <script src="components/QuestPanel.js"></script>
  <script src="services/RealtimeSocket.js"></script>
  <script src="components/OnlinePanel.js"></script>
  <script src="components/EquipmentPanel.js"></script>
  <script src="components/FactionPanel.js"></script>
  <script src="components/StoryPanel.js"></script>
  <script src="components/CollectionPanel.js"></script>
  <script src="components/StartScreen.js"></script>
  <script src="components/SummonerCreate.js"></script>
  <script src="../world/WorldEngine.js"></script>
  <script src="../world/WorldScreen.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
