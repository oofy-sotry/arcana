# Windows 설치 파일 빌드 → 태그(win-client-v<앱 버전>) push면 GitHub Releases에 업로드
# 수동 실행(workflow_dispatch)은 빌드만 하고 설치 파일을 Actions 아티팩트로 남긴다
name: Release

on:
  push:
    tags: ['win-client-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: 태그와 앱 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "win-client-v$version" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 apps/desktop 버전 $version 이 다름"
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gateway setup
      - run: pnpm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter 'desktop^...' # 워크스페이스 의존 패키지(shared·agent)만 빌드
        shell: bash # pwsh는 pnpm.CMD를 거쳐 cmd가 ^를 지워 desktop 자체(electron-builder)까지 빌드함
      - run: pnpm exec electron-builder --win --x64 --publish never
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/latest.yml
          if-no-files-found: error
      - name: GitHub Releases 업로드
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # latest.yml은 자동 업데이트(electron-updater)가 새 버전을 찾는 파일
          gh release create "$GITHUB_REF_NAME" apps/desktop/dist/*.exe apps/desktop/dist/*.blockmap apps/desktop/dist/latest.yml \
            --title "Arcana Windows 클라이언트 ${GITHUB_REF_NAME#win-client-}" --generate-notes
